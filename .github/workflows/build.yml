name: Build Project

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run Vitest Suite
        run: bun run test
      - name: Check the Impact Document
        run: bun run impact:check
      - name: Build
        run: bun run build

  cdn:
    name: Publish the Branch Build to the CDN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'renovate/') }}

    concurrency:
      group: cdn-dev-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build the Direct Files
        run: bun run build:cdn
      - name: Check the Credentials Are Present
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set under Settings, Secrets and variables, Actions." >&2
            exit 1
          fi
      - name: Publish and Read Back
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run publish:cdn --dev --branch="$GITHUB_REF_NAME" --verify --summary="$GITHUB_STEP_SUMMARY"

  nightly:
    name: Publish Nightly to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@drupflare'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Version with the Commit Hash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          NIGHTLY="${VERSION}-${GITHUB_SHA::7}"
          npm version "$NIGHTLY" --no-git-tag-version
          echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "Publishing nightly $NIGHTLY" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the Direct Files
        run: bun run build:cdn
      - name: Check the Credentials Are Present
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set under Settings, Secrets and variables, Actions." >&2
            exit 1
          fi
      - name: Publish the Commit Build to the CDN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run publish:cdn --release --verify --summary="$GITHUB_STEP_SUMMARY"
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public --tag nightly --registry https://npm.pkg.github.com
      - name: Tag the Nightly as Latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm dist-tag add "${PACKAGE}@${NIGHTLY}" latest \
            --registry https://npm.pkg.github.com
