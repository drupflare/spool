name: Publish CDN Client

on:
  push:
    branches-ignore: [master, 'renovate/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    name: Publish the Branch Build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: cdn-dev-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build the Client
        run: bun run build:cdn
      - name: Check the Credentials Are Present
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set under Settings, Secrets and variables, Actions." >&2
            exit 1
          fi
      - name: Publish and Read Back
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run publish:cdn --dev --branch="$GITHUB_REF_NAME" --verify --summary="$GITHUB_STEP_SUMMARY"

  gate:
    name: Gate Suite
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check the Embedded Bundles
        run: bun scripts/build-sw.ts --check
      - name: Typecheck
        run: bun run typecheck
      - name: Run Vitest Suite
        run: bun run test

  browser:
    name: Browser Lane
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/browser.yml

    permissions:
      contents: read

  release:
    name: Publish the Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, browser]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Check the GitHub Release Exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::v${VERSION} has no GitHub release yet. Run the Release Project workflow first, so the notes can carry the integrity hash." >&2
            exit 1
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build the Client
        run: bun run build:cdn
      - name: Check the Credentials Are Present
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set under Settings, Secrets and variables, Actions." >&2
            exit 1
          fi
      - name: Publish and Read Back
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run publish:cdn --release --verify --summary="$GITHUB_STEP_SUMMARY"
      - name: Add the Integrity Hash to the Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INTEGRITY=$(node -p "require('./dist/cdn/manifest.json').files['client.js'].integrity")
          WORKER=$(node -p "require('./dist/cdn/manifest.json').files['spool-sw.js'].integrity")
          BODY=$(gh release view "v${VERSION}" --json body --jq .body)
          case "$BODY" in
            *"$INTEGRITY"*) echo "The notes already carry this hash."; exit 0 ;;
          esac
          {
            printf '%s\n\n' "$BODY"
            echo "## Page Runtime"
            echo
            echo "The page runtime for this release is served from \`https://cdn.drupflare.com/spool/${VERSION}/client.js\` with this integrity hash:"
            echo
            echo "\`${INTEGRITY}\`"
            echo
            echo "Pass it to \`createSpool\` as \`cdn: { integrity: '${INTEGRITY}' }\`."
            echo
            echo "## Direct Files"
            echo
            echo "A site with no spool server serves \`spool-sw.js\` and \`client.js\` as files, with a \`spool.json\` beside them. Both are attached to this release and published under \`https://cdn.drupflare.com/spool/${VERSION}/\`. The worker script has this integrity hash:"
            echo
            echo "\`${WORKER}\`"
          } > notes.md
          gh release edit "v${VERSION}" --notes-file notes.md
