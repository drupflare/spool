name: Release Project

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  gate:
    name: Gate Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check the Embedded Bundles
        run: bun scripts/build-sw.ts --check
      - name: Typecheck
        run: bun run typecheck
      - name: Run Vitest Suite
        run: bun run test
      - name: Check the Impact Document
        run: bun run impact:check
      - name: Build
        run: bun run build

  browser:
    name: Browser Lane
    uses: ./.github/workflows/browser.yml

    permissions:
      contents: read

  cdn:
    name: Publish the Release Build to the CDN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, browser]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Read the Version
        env:
          SUFFIX: ${{ github.event.inputs.suffix }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build the Direct Files
        run: bun run build:cdn
      - name: Check the Credentials Are Present
        if: env.SUFFIX == ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set under Settings, Secrets and variables, Actions." >&2
            exit 1
          fi
      - name: Publish and Read Back
        if: env.SUFFIX == ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run publish:cdn --release --verify --summary="$GITHUB_STEP_SUMMARY"
      - name: Skip a Suffixed Release
        if: env.SUFFIX != ''
        run: echo "Suffix '${SUFFIX}' given; spool/${VERSION}/ is immutable and belongs to the unsuffixed release, so nothing was published to the CDN." >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the Build to the Release Job
        uses: actions/upload-artifact@v7
        with:
          name: cdn-build
          path: dist/cdn
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    needs: cdn

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted Version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Take the Published Build
        uses: actions/download-artifact@v7
        with:
          name: cdn-build
          path: dist/cdn
      - name: Retrieve Latest Tag
        id: latest_tag
        run: |
          echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
      - name: Generate Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
      - name: Write the Release Notes
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          SUFFIX: ${{ github.event.inputs.suffix }}
        run: |
          printf '%s\n' "$CHANGELOG" > notes.md
          if [ -z "$SUFFIX" ]; then
            INTEGRITY=$(node -p "require('./dist/cdn/manifest.json').files['client.js'].integrity")
            WORKER=$(node -p "require('./dist/cdn/manifest.json').files['spool-sw.js'].integrity")
            {
              echo
              echo "## Page Runtime"
              echo
              echo "The page runtime for this release is served from \`https://cdn.drupflare.com/spool/${VERSION}/client.js\` with this integrity hash:"
              echo
              echo "\`${INTEGRITY}\`"
              echo
              echo "Pass it to \`createSpool\` as \`cdn: { integrity: '${INTEGRITY}' }\`."
              echo
              echo "## Direct Files"
              echo
              echo "A site with no spool server serves \`spool-sw.js\` and \`client.js\` as files, with a \`spool.json\` beside them. Both are attached to this release and published under \`https://cdn.drupflare.com/spool/${VERSION}/\`. The worker script has this integrity hash:"
              echo
              echo "\`${WORKER}\`"
            } >> notes.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: spool v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          body_path: notes.md
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}
          files: |
            dist/cdn/client.js
            dist/cdn/spool-sw.js
            dist/cdn/manifest.json

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: release

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read the Version and the Package Name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
      - name: Refuse to Publish an Untagged Version
        run: |
          TAG="v${VERSION}${{ github.event.inputs.suffix }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} does not exist, so the release job did not create it. Refusing to publish an untagged version." >&2
            exit 1
          fi
          echo "Publishing against ${TAG}."
      - name: Skip a Suffixed Release
        id: suffix
        run: |
          if [ -n "${{ github.event.inputs.suffix }}" ]; then
            echo "Suffix '${{ github.event.inputs.suffix }}' given; package.json says ${VERSION}, so npm and the tag would disagree. Skipping the publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Bun
        if: steps.suffix.outputs.skip == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        if: steps.suffix.outputs.skip == 'false'
        run: bun install --frozen-lockfile
      - name: Verify the Gate Before Publishing
        if: steps.suffix.outputs.skip == 'false'
        run: |
          bun run typecheck
          bun run test
          bun run build
      - name: Set up Node for npm
        if: steps.suffix.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the Token Is Present
        if: steps.suffix.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set on this repository. Add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
      - name: Check Whether the Version Is Already on the Registry
        if: steps.suffix.outputs.skip == 'false'
        id: published
        run: |
          VERSIONS=$(npm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')
          if echo "$VERSIONS" | grep -q "\"${VERSION}\""; then
            echo "${PACKAGE}@${VERSION} is already on the registry; skipping the publish so a re-run is idempotent."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish
        if: steps.suffix.outputs.skip == 'false' && steps.published.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Publish to Job Summary
        if: always() && steps.suffix.outputs.skip == 'false'
        run: |
          echo "## npm publish" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`${PACKAGE}@${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.published.outputs.skip }}" = "true" ]; then
            echo "- Result: skipped, already on the registry" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Result: published with provenance" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Set up Node for GitHub Packages
        if: steps.suffix.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@drupflare'
      - name: Check Whether the Version Is Already on GitHub Packages
        if: steps.suffix.outputs.skip == 'false'
        id: published_gh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=$(npm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')
          if echo "$VERSIONS" | grep -q "\"${VERSION}\""; then
            echo "${PACKAGE}@${VERSION} is already on GitHub Packages; skipping so a re-run is idempotent."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to GitHub Packages
        if: steps.suffix.outputs.skip == 'false' && steps.published_gh.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public
      - name: GitHub Packages to Job Summary
        if: always() && steps.suffix.outputs.skip == 'false'
        run: |
          echo "## GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`${PACKAGE}@${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.published_gh.outputs.skip }}" = "true" ]; then
            echo "- Result: skipped, already on GitHub Packages" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Result: published" >> $GITHUB_STEP_SUMMARY
          fi
