name: Browser Lane

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]

    permissions:
      contents: read

    env:
      CI: 'true'
      SKIP_FRAMEWORKS: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Install the Browser
        run: bunx playwright install --with-deps ${{ matrix.engine }}
      - name: Run the Browser Suites
        run: bun run test:browser --project=${{ matrix.engine }}
      - name: Check the Browser Report
        if: ${{ !cancelled() }}
        run: bun scripts/check-browser-report.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Archive the Browser Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-report-${{ matrix.engine }}
          path: |
            playwright-report/
            playwright-results/
          retention-days: 14
          if-no-files-found: warn

  frameworks:
    name: frameworks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build the Package
        run: bun run build
      - name: Build the Framework Fixtures
        run: |
          for fixture in angular next nuxt react-router vue; do
            (cd tests/fixtures/frameworks/$fixture && bun install --ignore-scripts && bun run build)
          done
      - name: Install the Browser
        run: bunx playwright install --with-deps chromium
      - name: Run the Framework Suites
        run: bunx playwright test tests/browser/frameworks.pw.ts --project=chromium
      - name: Check the Browser Report
        if: ${{ !cancelled() }}
        run: bun scripts/check-browser-report.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Archive the Browser Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-report-frameworks
          path: |
            playwright-report/
            playwright-results/
          retention-days: 14
          if-no-files-found: warn
